name: Deploy bilingual frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check static frontend
        run: node check.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package public files only
        run: |
          mkdir -p _site
          cp index.html style.css app.js favicon.svg _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          touch _site/.nojekyll
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
